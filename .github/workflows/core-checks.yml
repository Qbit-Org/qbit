name: Core Checks

on:
  pull_request:
    # The same types as Required Merge Gate, which reads this workflow's run
    # of its own event.
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
    branches:
      - main
      - 1.x.x
      - 1.1.0
      - 1.0.0
      - 0.1.x
  push:
    branches:
      - main
      - 1.x.x
      - 1.1.0
      - 1.0.0
      - 0.1.x
  merge_group:
    branches:
      - main
      - 1.x.x
      - 1.1.0
      - 1.0.0
      - 0.1.x

permissions:
  contents: read

concurrency:
  group: core-checks-${{ github.event_name != 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  classify-changes:
    name: classify validation profile
    runs-on: ubuntu-24.04
    # The pass marker decision reads the run a marker names, its jobs and
    # artifacts and the cache listing (actions: read), and this pull request's
    # listing and timeline (pull-requests: read). Job permissions replace the
    # workflow's, so contents: read is repeated.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      profile: ${{ steps.classify.outputs.profile }}
      release_policy_only: ${{ steps.classify.outputs.release_policy_only }}
      source_validation_required: ${{ steps.classify.outputs.source_validation_required }}
      mainnet_publish_gate_required: ${{ steps.release-target.outputs.mainnet_publish_gate_required }}
      # 'true' only when the decision step ran, succeeded and said so; any
      # other outcome runs everything.
      tree_pass_skip: ${{ steps.marker-decision.outcome == 'success' && steps.marker-decision.outputs.skip == 'true' && 'true' || 'false' }}
      tree_pass_key_prefix: ${{ steps.marker-key.outputs.key_prefix }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Write changed file list
        id: changed-files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail

          changed_files="${RUNNER_TEMP}/changed-files.txt"
          : > "${changed_files}"

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ -z "${BASE_SHA}" ]]; then
              echo "::error::Pull request base SHA is unavailable."
              exit 1
            fi
            git diff --no-renames --name-only "${BASE_SHA}...HEAD" > "${changed_files}"
          elif [[ "${EVENT_NAME}" == "merge_group" ]]; then
            base_branch="${BASE_REF#refs/heads/}"
            if [[ -z "${base_branch}" ]]; then
              echo "::error::Merge-group base branch is unavailable."
              exit 1
            fi
            git fetch --no-tags --prune origin "+refs/heads/${base_branch}:refs/remotes/origin/${base_branch}"
            git diff --no-renames --name-only "origin/${base_branch}...HEAD" > "${changed_files}"
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ -n "${BEFORE_SHA}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
              git diff --no-renames --name-only "${BEFORE_SHA}..HEAD" > "${changed_files}"
            else
              git fetch --no-tags --prune origin "${DEFAULT_BRANCH}"
              merge_base="$(git merge-base "origin/${DEFAULT_BRANCH}" HEAD 2>/dev/null || true)"
              if [[ -n "${merge_base}" ]]; then
                git diff --no-renames --name-only "${merge_base}...HEAD" > "${changed_files}"
              else
                git diff-tree --no-commit-id --name-only -r HEAD > "${changed_files}"
              fi
            fi
          else
            git diff-tree --no-commit-id --name-only -r HEAD > "${changed_files}"
          fi

          cat "${changed_files}"
          echo "changed_files=${changed_files}" >> "$GITHUB_OUTPUT"

      - name: Classify validation profile
        id: classify
        run: |
          python3 ci/checks/classify_merge_profile.py \
            --changed-files "${{ steps.changed-files.outputs.changed_files }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Classify release target
        id: release-target
        env:
          TARGET_REF: ${{ github.base_ref || github.event.merge_group.base_ref || github.ref }}
          VALIDATION_PROFILE: ${{ steps.classify.outputs.profile }}
        run: |
          set -euo pipefail

          # Every mainnet release line runs the mainnet publication posture
          # check: main and every release branch of major version 1 or later
          # (1.x.x, 1.1.0, 1.0.0, ...). The 0.x lines are testnet.
          mainnet_line_re='^(main|[1-9][0-9]*\.(x|[0-9]+)\.(x|[0-9]+))$'
          target_branch="${TARGET_REF#refs/heads/}"
          if [[ "${target_branch}" =~ ${mainnet_line_re} ]] && \
             [[ "${VALIDATION_PROFILE}" == "source" || "${VALIDATION_PROFILE}" == "release-policy" ]]; then
            echo "mainnet_publish_gate_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "mainnet_publish_gate_required=false" >> "$GITHUB_OUTPUT"
          fi

      # Same-tree skip (doc/development/ci-same-tree-skip.md): a pull request
      # whose commit under test has a tree that already passed this workflow,
      # routed the same way, skips the jobs below. Pull requests only; every
      # failure in these steps runs everything.
      - name: Compute pass marker key
        id: marker-key
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          # Bump to invalidate every pass marker of this workflow.
          TREE_PASS_MARKER_SALT: '1'
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.changed_files }}
        run: |
          python3 ci/checks/tree_pass_marker.py key \
            --workflow-ref "${GITHUB_WORKFLOW_REF}" \
            --repository "${GITHUB_REPOSITORY}" \
            --salt "${TREE_PASS_MARKER_SALT}" \
            --event "${EVENT_NAME}" \
            --sha "${GITHUB_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --base-ref "${BASE_REF}" \
            --changed-files "${CHANGED_FILES}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Look up pass marker
        id: marker-lookup
        if: github.event_name == 'pull_request' && steps.marker-key.outputs.key_prefix != ''
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tree-pass-marker
          key: ${{ steps.marker-key.outputs.key_prefix }}
          restore-keys: ${{ steps.marker-key.outputs.key_prefix }}
          lookup-only: true

      - name: Decide whether this tree already passed
        id: marker-decision
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          VALIDATION_PROFILE: ${{ steps.classify.outputs.profile }}
          KEY_OUTCOME: ${{ steps.marker-key.outcome }}
          KEY_PREFIX: ${{ steps.marker-key.outputs.key_prefix }}
          HEAD_TREE: ${{ steps.marker-key.outputs.head_tree }}
          WORKFLOW_PATH: ${{ steps.marker-key.outputs.workflow_path }}
          LOOKUP_OUTCOME: ${{ steps.marker-lookup.outcome }}
          MATCHED_KEY: ${{ steps.marker-lookup.outputs.cache-matched-key }}
          HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 ci/checks/tree_pass_marker.py decide \
            --event "${EVENT_NAME}" \
            --labels-json "${PR_LABELS}" \
            --profile "${VALIDATION_PROFILE}" \
            --key-outcome "${KEY_OUTCOME}" \
            --key-prefix "${KEY_PREFIX}" \
            --head-tree "${HEAD_TREE}" \
            --workflow-path "${WORKFLOW_PATH}" \
            --lookup-outcome "${LOOKUP_OUTCOME}" \
            --matched-key "${MATCHED_KEY}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --repository "${GITHUB_REPOSITORY}" \
            --head-repository-id "${HEAD_REPOSITORY_ID}" \
            --head-ref "${HEAD_REF}" \
            --head-owner "${HEAD_OWNER}" \
            --pr-number "${PR_NUMBER}" \
            --gate-job 'Core Checks Gate' \
            --save-job 'save pass marker' \
            --github-output "${GITHUB_OUTPUT}"

  build-smoke:
    name: build smoke
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.source_validation_required == 'true' && needs.classify-changes.outputs.tree_pass_skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Release fuzz evidence is counted at the coverage anchors in
      # test_qbit_fuzz_coverage.py. A source change that alters, removes or
      # duplicates an anchored line fails here instead of when the evidence
      # is next regenerated. These checks need no build.
      - name: Test qbit fuzz tooling
        run: |
          python3 test/fuzz/test_qbit_fuzz_coverage.py --anchors-only
          python3 test/fuzz/test_qbit_fuzz_runner.py
          python3 test/fuzz/qbit_corpora/generate_seeds.py --check

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkgconf \
            python3 \
            libboost-dev \
            libevent-dev \
            libsqlite3-dev

      - name: Test integrated libbitcoinpqc build policy
        run: python3 ci/checks/test_libbitcoinpqc_build_policy.py

      - name: Test IBD timeout wiring
        run: python3 ci/checks/test_ibd_timeout_wiring.py

      - name: Configure build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_GUI=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_BENCH=OFF \
            -DBUILD_FUZZ_BINARY=OFF \
            -DENABLE_IPC=OFF \
            -DWITH_ZMQ=OFF \
            -DWITH_USDT=OFF \
            -DWITH_CCACHE=OFF

      - name: Verify integrated libbitcoinpqc compile definitions
        run: |
          grep -Fx 'SPX_ENABLE_TEST_BENCH_ENV_KNOBS:BOOL=OFF' build/CMakeCache.txt
          cmake --build build --target bitcoinpqc --verbose 2>&1 | tee bitcoinpqc-build.log
          grep -F -- '-DSPX_PRODUCTION_BUILD=1' bitcoinpqc-build.log
          if grep -F -- '-DSPX_ENABLE_TEST_BENCH_ENV_KNOBS=1' bitcoinpqc-build.log; then
            echo 'Integrated libbitcoinpqc build unexpectedly enabled runtime test controls.' >&2
            exit 1
          fi

      - name: Build daemon and CLI
        run: cmake --build build --target qbitd qbit-cli -j"$(nproc)"

      - name: Smoke binaries
        run: |
          test -x build/bin/qbitd
          test -x build/bin/qbit-cli
          build/bin/qbitd -version
          build/bin/qbit-cli -version

  focused-unit-suites:
    name: focused unit suites
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.source_validation_required == 'true' && needs.classify-changes.outputs.tree_pass_skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkgconf \
            python3 \
            libboost-dev \
            libevent-dev \
            libsqlite3-dev

      - name: Configure unit build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_GUI=OFF \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCH=OFF \
            -DBUILD_FUZZ_BINARY=OFF \
            -DENABLE_IPC=OFF \
            -DWITH_ZMQ=OFF \
            -DWITH_USDT=OFF \
            -DWITH_CCACHE=OFF

      - name: Build unit test binary
        run: cmake --build build --target test_bitcoin -j"$(nproc)"

      - name: Run focused unit suites
        run: |
          suites=(
            pqc_tests
            asert_tests
            auxpow_tests
            pow_tests
            subsidy_tests
            script_p2mr_tests
            key_io_p2mr_tests
            descriptor_p2mr_tests
            getarg_tests
            rpc_tests
            orphan_metrics_tests
          )
          for suite in "${suites[@]}"; do
            build/bin/test_qbit --run_test="${suite}" --catch_system_error=no --log_level=test_suite
          done

  p2mr-v1-conformance:
    name: P2MR v1 conformance
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.source_validation_required == 'true' && needs.classify-changes.outputs.tree_pass_skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set standalone oracle target directory
        run: echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/p2mr-rust-target" >> "$GITHUB_ENV"

      - name: Install oracle build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            libclang-dev \
            pkgconf \
            python3

      - name: Check Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Fetch locked Rust dependencies
        run: |
          cargo fetch --locked --target x86_64-unknown-linux-gnu \
            --manifest-path contrib/testgen/p2mr_v1_oracle/Cargo.toml
          cargo fetch --locked --target x86_64-unknown-linux-gnu \
            --manifest-path contrib/testgen/p2mr_checksigpqc_vectors/Cargo.toml

      - name: Test standalone oracle
        run: |
          cargo fmt --manifest-path contrib/testgen/p2mr_v1_oracle/Cargo.toml -- --check
          cargo test --locked --offline \
            --manifest-path contrib/testgen/p2mr_v1_oracle/Cargo.toml

      - name: Verify P2MR v1 corpus
        run: |
          set -o pipefail
          cargo run --locked --offline --quiet \
            --manifest-path contrib/testgen/p2mr_v1_oracle/Cargo.toml -- \
            verify \
            --manifest src/test/data/p2mr_v1_manifest.json \
            --source-root . \
            --report "${RUNNER_TEMP}/p2mr-v1-conformance-report.json" \
            --release \
            --oracle-commit "${GITHUB_SHA}" \
            2>&1 | tee "${RUNNER_TEMP}/p2mr-v1-oracle.log"

      - name: Check corpus reproducibility
        run: contrib/devtools/check-p2mr-v1-corpus-reproducible.sh

      - name: Write conformance summary
        if: ${{ success() }}
        run: |
          jq -r '
            "### qbit P2MR v1 conformance\n\n" +
            "- Manifest: `" + .manifest_sha256 + "`\n" +
            "- Cases: " + (.case_counts.total | tostring) +
            " (" + (.case_counts.accepted | tostring) + " accepted, " +
            (.case_counts.rejected | tostring) + " rejected)\n" +
            "- Oracle commit: `" + .oracle.commit + "`"
          ' "${RUNNER_TEMP}/p2mr-v1-conformance-report.json" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload conformance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p2mr-v1-conformance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/p2mr-v1-conformance-report.json
            ${{ runner.temp }}/p2mr-v1-oracle.log
          if-no-files-found: warn
          retention-days: 30

  functional-smoke:
    name: functional smoke
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.source_validation_required == 'true' && needs.classify-changes.outputs.tree_pass_skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkgconf \
            python3 \
            libboost-dev \
            libevent-dev \
            libsqlite3-dev

      - name: Configure functional build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_GUI=OFF \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCH=OFF \
            -DBUILD_FUZZ_BINARY=OFF \
            -DENABLE_IPC=OFF \
            -DWITH_ZMQ=OFF \
            -DWITH_USDT=OFF \
            -DWITH_CCACHE=OFF

      - name: Build functional test binaries
        run: cmake --build build --target qbitd qbit-cli bitcoin-tx bitcoin-util -j"$(nproc)"

      - name: Run functional smoke
        run: |
          ulimit -n 10240 || true
          build/test/functional/test_runner.py \
            --jobs "$(nproc)" \
            --ci \
            --quiet \
            --tmpdirprefix="${RUNNER_TEMP}" \
            --combinedlogslen=2000 \
            --timeout-factor=2 \
            feature_config_args.py \
            feature_help.py \
            interface_bitcoin_cli.py \
            mining_basic.py \
            mempool_dust.py \
            p2p_handshake.py \
            rpc_whitelist.py \
            feature_orphan_metrics.py

  # The same-tree skip's own contract: the decision rules of
  # ci/checks/tree_pass_marker.py and the wiring of this workflow and Full
  # Validation (doc/development/ci-same-tree-skip.md). The pass marker never
  # skips it, so a regression that skips without a valid marker cannot also
  # skip the job that would catch it, and Core Checks Gate requires it to
  # succeed in every run. It runs here, for changes routed to source, rather
  # than in Required Merge Gate's classification, which every pull request
  # waits for.
  same-tree-skip-contract:
    name: same-tree skip contract
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.source_validation_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # Use the system Python that owns the distribution's PyYAML package.
      # This job runs in every skip run too, so a package mirror hiccup must
      # not turn a skip red: nothing is installed when the module is already
      # there, and the install is retried.
      - name: Install workflow contract dependencies
        run: |
          if /usr/bin/python3 -c 'import yaml' 2>/dev/null; then
            echo "PyYAML is already installed."
            exit 0
          fi
          ci/retry/retry --tries=3 --min=5 --max=30 -- sudo apt-get update
          ci/retry/retry --tries=3 --min=5 --max=30 -- sudo apt-get install -y --no-install-recommends python3-yaml

      - name: Test same-tree skip contract
        run: /usr/bin/python3 ci/checks/test_tree_pass_marker.py -v

  release-validator-tests:
    name: release validator tests
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.source_validation_required == 'true' && needs.classify-changes.outputs.tree_pass_skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Detect release file changes
        id: release_changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          RELEASE_BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: |
          changed_files="$(mktemp)"

          if [[ "${EVENT_NAME}" == "push" ]]; then
            before="${EVENT_BEFORE}"
            if [[ -z "${before}" || "${before}" =~ ^0+$ ]]; then
              git fetch --no-tags --prune origin main
              merge_base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
              if [[ -n "${merge_base}" ]]; then
                git diff --no-renames --name-only "${merge_base}" HEAD > "${changed_files}"
              else
                git diff-tree --no-commit-id --name-only -r HEAD > "${changed_files}"
              fi
            elif ! git diff --no-renames --name-only "${before}" HEAD > "${changed_files}"; then
              echo "Could not diff push range; running release validator tests."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            base_ref="${RELEASE_BASE_REF}"
            base_branch="${base_ref#refs/heads/}"
            if [[ -z "${base_branch}" ]]; then
              echo "Could not determine event base branch; running release validator tests."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git fetch --no-tags --prune origin "+refs/heads/${base_branch}:refs/remotes/origin/${base_branch}"
            if ! git diff --no-renames --name-only "origin/${base_branch}...HEAD" > "${changed_files}"; then
              echo "Could not diff against origin/${base_branch}; running release validator tests."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          release_process_re='contrib/release-''process/'
          release_sanitize_re='contrib/release-''sanitize/'
          release_path_re="^(ci/release/|contrib/guix/|${release_process_re}|${release_sanitize_re})"
          if grep -E "${release_path_re}" "${changed_files}"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No release validator paths changed."
          fi

      - name: Install release test dependencies
        if: steps.release_changes.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gpg

      - name: Run release validator tests
        if: steps.release_changes.outputs.changed == 'true'
        run: |
          release_process_dir='contrib/release-''process'
          release_sanitize_dir='contrib/release-''sanitize'
          # Retained public release tests cover the public publisher and its
          # validators, so a missing file is a regression and must fail.
          required_tests=(
            ci/release/test_publish_local_release.py
            ci/release/test_release_staging_tools.py
            ci/release/test_validate_builder_attestations.py
            ci/release/test_validate_key_metadata.py
            ci/release/test_validate_release_artifacts.py
            ci/release/test_verify_mainnet_release_posture.py
            ci/release/test_verify_p2mr_v1_conformance.py
            ci/release/test_verify_testnet_release_posture.py
            contrib/guix/test_build_config.py
          )
          # Tests for tooling the sanitizer strips from public snapshots: run
          # when present (source tree), skip when intentionally absent (public).
          optional_tests=(
            "${release_process_dir}/test_release_signing_helpers.py"
            "${release_process_dir}/test_verify_testnet_release_posture.py"
            "${release_sanitize_dir}/test_export_public_snapshot.py"
          )
          for test_file in "${required_tests[@]}"; do
            if [[ ! -f "${test_file}" ]]; then
              echo "::error::Required public release test ${test_file} is missing." >&2
              exit 1
            fi
            python3 "${test_file}"
          done
          for test_file in "${optional_tests[@]}"; do
            if [[ ! -f "${test_file}" ]]; then
              echo "Skipping ${test_file}; it is stripped from this checkout."
              continue
            fi
            python3 "${test_file}"
          done

  mainnet-publish-gate:
    name: mainnet publication posture
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.mainnet_publish_gate_required == 'true' && needs.classify-changes.outputs.tree_pass_skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Create immutable CI release-candidate tag
        id: release-candidate
        run: |
          set -euo pipefail

          source_sha="$(git rev-parse HEAD)"
          candidate_tag="v0.0.0-mainnet-posture-ci.${source_sha}"
          git \
            -c user.name='qbit Core Checks' \
            -c user.email='core-checks@qbit.org' \
            -c tag.gpgSign=false \
            tag --annotate "${candidate_tag}" "${source_sha}" \
            --message "Core Checks mainnet posture candidate ${source_sha}"
          echo "tag=${candidate_tag}" >> "$GITHUB_OUTPUT"

      - name: Run fail-closed mainnet publication gate
        env:
          RELEASE_CANDIDATE_TAG: ${{ steps.release-candidate.outputs.tag }}
        run: |
          set -euo pipefail
          python3 ci/release/verify_mainnet_release_posture.py \
            --source-root "$GITHUB_WORKSPACE" \
            --release-tag "${RELEASE_CANDIDATE_TAG}"

  core-checks-gate:
    name: 'Core Checks Gate'
    runs-on: ubuntu-24.04
    needs:
      - classify-changes
      - build-smoke
      - focused-unit-suites
      - p2mr-v1-conformance
      - functional-smoke
      - same-tree-skip-contract
      - release-validator-tests
      - mainnet-publish-gate
    # Aggregate core check input for Required Merge Gate. The mainnet
    # posture runs for source and release-policy changes targeting a mainnet
    # release line; source build/test jobs remain conditional on source
    # validation.
    if: ${{ always() }}
    steps:
      - name: Check core check results
        env:
          CLASSIFY_CHANGES_RESULT: ${{ needs.classify-changes.result }}
          VALIDATION_PROFILE: ${{ needs.classify-changes.outputs.profile }}
          SOURCE_VALIDATION_REQUIRED: ${{ needs.classify-changes.outputs.source_validation_required }}
          BUILD_SMOKE_RESULT: ${{ needs.build-smoke.result }}
          FOCUSED_UNIT_SUITES_RESULT: ${{ needs.focused-unit-suites.result }}
          P2MR_V1_CONFORMANCE_RESULT: ${{ needs.p2mr-v1-conformance.result }}
          FUNCTIONAL_SMOKE_RESULT: ${{ needs.functional-smoke.result }}
          SAME_TREE_SKIP_CONTRACT_RESULT: ${{ needs.same-tree-skip-contract.result }}
          RELEASE_VALIDATOR_TESTS_RESULT: ${{ needs.release-validator-tests.result }}
          MAINNET_PUBLISH_GATE_REQUIRED: ${{ needs.classify-changes.outputs.mainnet_publish_gate_required }}
          MAINNET_PUBLISH_GATE_RESULT: ${{ needs.mainnet-publish-gate.result }}
          EVENT_NAME: ${{ github.event_name }}
          TREE_PASS_SKIP: ${{ needs.classify-changes.outputs.tree_pass_skip }}
        run: |
          set -euo pipefail

          # A pull request whose tree already passed this workflow skips the
          # jobs above (doc/development/ci-same-tree-skip.md). Only then is a
          # skipped job accepted; a failed or cancelled job never is.
          marker_skip=false
          if [[ "${TREE_PASS_SKIP}" == "true" ]]; then
            if [[ "${EVENT_NAME}" != "pull_request" ]]; then
              echo "::error title=Core Checks failed::A ${EVENT_NAME} run reported a pass marker skip; only pull requests skip."
              exit 1
            fi
            marker_skip=true
          fi

          failed=0
          check_result() {
            local name="$1"
            local result="$2"

            echo "${name}: ${result}"
            if [[ "${result}" != "success" ]]; then
              echo "::error title=Core Checks failed::${name} result was ${result}."
              failed=1
            fi
          }

          # A job the pass marker may skip.
          check_job() {
            if [[ "${marker_skip}" == "true" && "$2" == "skipped" ]]; then
              echo "$1: skipped, this tree already passed Core Checks"
              return 0
            fi
            check_result "$1" "$2"
          }

          check_result "classify validation profile" "${CLASSIFY_CHANGES_RESULT}"

          if [[ "${MAINNET_PUBLISH_GATE_REQUIRED}" == "true" ]]; then
            check_job "mainnet publication posture" "${MAINNET_PUBLISH_GATE_RESULT}"
          else
            echo "Mainnet publication posture is not required for this target/profile."
          fi

          if [[ "${SOURCE_VALIDATION_REQUIRED}" != "true" ]]; then
            echo "Validation profile ${VALIDATION_PROFILE} does not require source core checks."
            exit "${failed}"
          fi

          check_job "build smoke" "${BUILD_SMOKE_RESULT}"
          check_job "focused unit suites" "${FOCUSED_UNIT_SUITES_RESULT}"
          check_job "P2MR v1 conformance" "${P2MR_V1_CONFORMANCE_RESULT}"
          check_job "functional smoke" "${FUNCTIONAL_SMOKE_RESULT}"
          check_result "same-tree skip contract" "${SAME_TREE_SKIP_CONTRACT_RESULT}"
          check_job "release validator tests" "${RELEASE_VALIDATOR_TESTS_RESULT}"

          if [[ "${marker_skip}" == "true" && "${failed}" == "0" ]]; then
            echo "::notice title=Core Checks::This tree already passed Core Checks in an earlier run of this pull request."
          fi
          exit "${failed}"

  # Saves this run's pass marker, only after a pull request run that did all
  # of the work above and passed (doc/development/ci-same-tree-skip.md).
  save-pass-marker:
    name: save pass marker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - classify-changes
      - build-smoke
      - focused-unit-suites
      - p2mr-v1-conformance
      - functional-smoke
      - same-tree-skip-contract
      - release-validator-tests
      - mainnet-publish-gate
      - core-checks-gate
    if: ${{ always() && github.event_name == 'pull_request' && needs.classify-changes.outputs.profile == 'source' && needs.classify-changes.outputs.tree_pass_skip == 'false' && needs.core-checks-gate.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          sparse-checkout: ci/checks
          persist-credentials: false

      - name: Check every job passed
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 ci/checks/tree_pass_marker.py save-plan \
            --event "${EVENT_NAME}" \
            --needs-json "${NEEDS_JSON}" \
            --classify-job classify-changes \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --sha "${GITHUB_SHA}" \
            --pr-number "${PR_NUMBER}" \
            --optional-job mainnet-publish-gate=mainnet_publish_gate_required \
            --marker-dir .tree-pass-marker \
            --github-output "${GITHUB_OUTPUT}"

      # The proof that this run's own checks approved the marker. Only a job
      # of this run can upload an artifact to it, and a run that vouches for a
      # tree ran that very tree's code. Uploaded before the marker, so a
      # marker never exists without it.
      - name: Upload pass marker proof
        id: proof
        if: steps.plan.outputs.save == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.plan.outputs.artifact }}
          path: .tree-pass-marker/marker.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Save pass marker
        if: steps.plan.outputs.save == 'true' && steps.proof.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tree-pass-marker
          key: ${{ steps.plan.outputs.key }}
