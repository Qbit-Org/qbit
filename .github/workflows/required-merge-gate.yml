              exit 1
            fi
            diff_range="${BASE_SHA}...HEAD"
            git diff --no-renames --name-only "${diff_range}" > "${changed_files}"
          elif [[ "${EVENT_NAME}" == "merge_group" ]]; then
            base_branch="${BASE_REF#refs/heads/}"
            if [[ -z "${base_branch}" ]]; then
              echo "::error::Merge-group base branch is unavailable."
              exit 1
            fi
            git fetch --no-tags --prune origin "+refs/heads/${base_branch}:refs/remotes/origin/${base_branch}"
            diff_range="origin/${base_branch}...HEAD"
            git diff --no-renames --name-only "${diff_range}" > "${changed_files}"
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ -n "${BEFORE_SHA}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
              diff_range="${BEFORE_SHA}..HEAD"
              git diff --no-renames --name-only "${diff_range}" > "${changed_files}"
            else
              git fetch --no-tags --prune origin "${DEFAULT_BRANCH}"
              merge_base="$(git merge-base "origin/${DEFAULT_BRANCH}" HEAD 2>/dev/null || true)"
              if [[ -n "${merge_base}" ]]; then
                diff_range="${merge_base}...HEAD"
                git diff --no-renames --name-only "${diff_range}" > "${changed_files}"
              else
                git diff-tree --no-commit-id --name-only -r HEAD > "${changed_files}"
              fi
            fi
          else
            git diff-tree --no-commit-id --name-only -r HEAD > "${changed_files}"
          fi

          cat "${changed_files}"
          echo "changed_files=${changed_files}" >> "$GITHUB_OUTPUT"
          echo "diff_range=${diff_range}" >> "$GITHUB_OUTPUT"

      - name: Confirm github-metadata profile
        run: |
          python3 ci/checks/classify_merge_profile.py \
            --changed-files "${{ steps.changed-files.outputs.changed_files }}" \
            --require-profile github-metadata

      - name: Check whitespace in changed files
        env:
          DIFF_RANGE: ${{ steps.changed-files.outputs.diff_range }}
        run: |
          set -euo pipefail

          if [[ -n "${DIFF_RANGE}" ]]; then
            git diff --check "${DIFF_RANGE}"
          else
            git diff-tree --check --root HEAD
          fi

      - name: Validate JSON metadata
        run: jq empty .github/rulesets/*.json .github/repository-settings/*.json

      - name: Check branch ruleset aggregate gate
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in (
              Path(".github/rulesets/main.json"),
              Path(".github/rulesets/1.0.0.json"),
              Path(".github/rulesets/1.x.x.json"),
              Path(".github/rulesets/0.1.x.json"),
          ):
              data = json.loads(path.read_text(encoding="utf8"))
              contexts = []
              strict = None
              for rule in data.get("rules", []):
                  if rule.get("type") == "required_status_checks":
                      parameters = rule.get("parameters", {})
                      checks = parameters.get("required_status_checks", [])
                      contexts = [check.get("context") for check in checks]
                      strict = parameters.get("strict_required_status_checks_policy")
                      break
              if contexts != ["Required Merge Gate"]:
                  raise SystemExit(
                      f"{path}: required status checks must be exactly ['Required Merge Gate'], got {contexts!r}"
                  )
              if strict is not False:
                  raise SystemExit(
                      f"{path}: strict required status checks policy must be false, got {strict!r}"
                  )
              print(f"{path}: Required Merge Gate (branch update not required)")
          PY

      - name: Check issue template YAML syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path

          try:
              import yaml
          except ModuleNotFoundError:
              print("PyYAML is not installed; skipping best-effort YAML parse.")
              raise SystemExit(0)

          for path in sorted(Path(".github/ISSUE_TEMPLATE").glob("*.yml")):
              yaml.safe_load(path.read_text(encoding="utf8"))
              print(f"Parsed {path}")
          PY

  required-merge-gate:
    name: 'Required Merge Gate'
    needs:
      - classify-changes
      - operator-key-policy-validation
      - release-policy-validation
      - rpc-docs-validation
      - public-docs-validation
      - github-metadata-validation
    # Drafts run the gate too, and fail it. A job its condition skips leaves
    # a skipped check, which branch protection accepts as passing.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # Only this job reads other workflows' runs and check runs.
    permissions:
      actions: read
      checks: read
    steps:
      - name: Check required validation profile
        env:
          GH_TOKEN: ${{ github.token }}
          CLASSIFY_CHANGES_RESULT: ${{ needs.classify-changes.result }}
          OPERATOR_KEY_POLICY_VALIDATION_RESULT: ${{ needs.operator-key-policy-validation.result }}
          VALIDATION_PROFILE: ${{ needs.classify-changes.outputs.profile }}
          RELEASE_POLICY_VALIDATION_RESULT: ${{ needs.release-policy-validation.result }}
          RPC_DOCS_VALIDATION_RESULT: ${{ needs.rpc-docs-validation.result }}
          PUBLIC_DOCS_VALIDATION_RESULT: ${{ needs.public-docs-validation.result }}
          GITHUB_METADATA_VALIDATION_RESULT: ${{ needs.github-metadata-validation.result }}
          SOURCE_VALIDATION_REQUIRED: ${{ needs.classify-changes.outputs.source_validation_required }}
          TOUCHED_OPERATOR_KEYS: ${{ needs.classify-changes.outputs.touched_operator_keys }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" && "${PR_DRAFT}" != "false" ]]; then
            if [[ "${PR_DRAFT}" == "true" ]]; then
              echo "::error title=Required Merge Gate failed::Pull request #${PR_NUMBER} is a draft: draft pull requests are not mergeable. Mark it ready for review to run the gate."
            else
              echo "::error title=Required Merge Gate failed::Pull request draft state '${PR_DRAFT}' could not be read."
            fi
            exit 1
          fi

          if [[ "${CLASSIFY_CHANGES_RESULT}" != "success" ]]; then
            echo "::error title=Required Merge Gate failed::Change classification result was ${CLASSIFY_CHANGES_RESULT}."
            exit 1
          fi

          if [[ "${TOUCHED_OPERATOR_KEYS}" == "true" \
            && "${OPERATOR_KEY_POLICY_VALIDATION_RESULT}" != "success" ]]; then
            echo "::error title=Required Merge Gate failed::Operator-key policy validation result was ${OPERATOR_KEY_POLICY_VALIDATION_RESULT}."
            exit 1
          fi

          # Waiting tunables. The defaults are the production values; the
          # contract test overrides them so the real loop runs in seconds.
          #
          # GATE_WAIT_TIMEOUT_SECONDS must stay below this job's
          # timeout-minutes (360, the GitHub-hosted maximum, which cannot be
          # raised) so the loop reports which checks were still pending
          # instead of being cancelled by the runner with no verdict. The
          # deadline below is wall-clock, so time spent inside the API calls
          # counts against it and not only the sleeps.
          GATE_WAIT_TIMEOUT_SECONDS="${GATE_WAIT_TIMEOUT_SECONDS:-19800}"
          GATE_POLL_INTERVAL_SECONDS="${GATE_POLL_INTERVAL_SECONDS:-30}"
          GATE_QUERY_MAX_ATTEMPTS="${GATE_QUERY_MAX_ATTEMPTS:-6}"
          GATE_QUERY_BACKOFF_SECONDS="${GATE_QUERY_BACKOFF_SECONDS:-10}"
          GATE_QUERY_BACKOFF_CAP_SECONDS="${GATE_QUERY_BACKOFF_CAP_SECONDS:-60}"
          GATE_QUERY_TIMEOUT_SECONDS="${GATE_QUERY_TIMEOUT_SECONDS:-60}"

          for gate_tunable in \
            GATE_WAIT_TIMEOUT_SECONDS \
            GATE_POLL_INTERVAL_SECONDS \
            GATE_QUERY_MAX_ATTEMPTS \
            GATE_QUERY_BACKOFF_SECONDS \
            GATE_QUERY_BACKOFF_CAP_SECONDS \
            GATE_QUERY_TIMEOUT_SECONDS
          do
            if [[ ! "${!gate_tunable}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error title=Required Merge Gate failed::${gate_tunable} must be a positive integer, got '${!gate_tunable}'."
              exit 1
            fi
          done

          # The waits below read only the workflow runs this event started,
          # so they need the event and this gate's own run.
          case "${EVENT_NAME}" in
            pull_request)
              if [[ ! "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
                echo "::error title=Required Merge Gate failed::Pull request number '${PR_NUMBER}' could not be read."
                exit 1
              fi
              pr_json="${PR_NUMBER}"
              ;;
            push | merge_group)
              pr_json=null
              ;;
            *)
              echo "::error title=Required Merge Gate failed::Unsupported event ${EVENT_NAME}."
              exit 1
              ;;
          esac
          if [[ ! "${RUN_ID}" =~ ^[1-9][0-9]*$ || ! "${SHA}" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]; then
            echo "::error title=Required Merge Gate failed::Run ID '${RUN_ID}' or head SHA '${SHA}' could not be read."
            exit 1
          fi

          # The workflows that report the checks the profiles wait for. Both
          # run for every event this gate runs for, so each wait reads the run
          # its own event started.
          WORKFLOW_PATHS=(.github/workflows/ci.yml .github/workflows/core-checks.yml)
          workflow_of() {
            case "$1" in
              "Full Validation Gate" | rpc-docs | public-docs-lint)
                echo ".github/workflows/ci.yml"
                ;;
              "Core Checks Gate")
                echo ".github/workflows/core-checks.yml"
                ;;
              *)
                return 1
                ;;
            esac
          }

          # The runs one event starts are created up to a second or two
          # apart, in either order: Full Validation and Core Checks have been
          # stamped a second before the gate run of the same event. Events
          # closer together than this cannot be told apart by creation time,
          # so for them the newest run wins.
          SIBLING_RUN_SKEW_SECONDS=60

          # Selection contract, applied to the slurped pages of /actions/runs
          # for ${SHA} and this event:
          #
          # * a page without a workflow_runs array is malformed, and this
          #   gate's own run must be listed. It fixes the head branch and
          #   repository, and whether GitHub ties these runs to pull request
          #   $pr; GitHub ties none to a fork's head branch;
          # * a run of a workflow counts only if it matches all of that and
          #   was created at most $skew seconds before this gate run. A run
          #   created at least $skew seconds after the previous gate run for
          #   the same head counts too: that is too late to be the previous
          #   event's;
          # * the newest run that counts wins. A re-run keeps its run and its
          #   check suite, so its check runs are read from that suite;
          # * the output is one line per workflow, in $workflows order: the
          #   path, then "absent" or the run's check suite, ID and creation
          #   time.
          # The $ names are jq variables bound by --arg and --argjson below.
          # shellcheck disable=SC2016
          workflow_run_filter='
            def created: .created_at | fromdateiso8601;
            def for_pr: $pr != null and any(.pull_requests[]?; .number == $pr);
            if type != "array" or length == 0 then error("empty workflow-runs response") else . end
            | map(if (.workflow_runs | type) == "array" then .workflow_runs else error("malformed workflow-runs page") end)
            | add
            | map(select(.event == $event and .head_sha == $sha))
            | (map(select(.id == $run_id)) | if length == 1 then .[0] else error("run \($run_id) is not listed") end) as $self
            | ($self | created) as $self_created
            | map(select(
                .head_branch == $self.head_branch
                and .head_repository.id == $self.head_repository.id
                and for_pr == ($self | for_pr)
              ))
            | . as $runs
            | ([$runs[] | select(.path == $self.path and ([created, .id] < [$self_created, $self.id])) | created] | max) as $previous
            | ([$self_created - $skew, ($previous // empty) + $skew] | min) as $floor
            | $workflows
            | split(" ")
            | .[]
            | . as $path
            | [$runs[] | select(.path == $path and created >= $floor)]
            | max_by([created, .id])
            | if . == null then [$path, "absent"] else [$path, .check_suite_id, .id, .created_at] end
            | @tsv
          '

          # Selection contract, applied to the slurped pages of
          # /check-suites/{id}/check-runs:
          #
          # * a page without a check_runs array is malformed and must never be
          #   mistaken for "this suite has no check runs";
          # * a re-run check appears more than once, so the newest run by
          #   started_at (created_at while a run has not started) wins;
          # * "absent" means the query succeeded and reported no run with that
          #   name, which is a different fact from a query that could not be
          #   read at all.
          # $name is a jq variable bound by --arg below, not a shell expansion.
          # shellcheck disable=SC2016
          check_run_filter='
            if type != "array" or length == 0 then error("empty check-runs response") else . end
            | map(if (.check_runs | type) == "array" then .check_runs else error("malformed check-runs page") end)
            | add
            | map(select(.name == $name))
            | sort_by(.started_at // .created_at // "")
            | last
            | if . == null then "absent" else ["found", (.status // ""), (.conclusion // "")] | @tsv end
          '

          summarize_stderr() {
            tr '\n' ' ' < "$1" | cut -c1-300
          }

          # Whether $1 is a check-run observation: "absent", or
          # "found<TAB>status<TAB>conclusion" with a status GitHub could send.
          is_check_run_observation() {
            local fields

            case "$1" in
              absent)
                return 0
                ;;
              found$'\t'*)
                fields="${1#found$'\t'}"
                if [[ "${fields%%$'\t'*}" =~ ^[a-z_]+$ ]]; then
                  return 0
                fi
                ;;
            esac
            return 1
          }

          # Whether $1 is a workflow-runs observation: exactly one line for
          # each workflow, in WORKFLOW_PATHS order.
          is_workflow_runs_observation() {
            local line
            local index=0
            local pattern=$'^([^\t]+)\t(absent|[1-9][0-9]*\t[1-9][0-9]*\t[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z)$'

            while IFS= read -r line; do
              if (( index >= ${#WORKFLOW_PATHS[@]} )) \
                || [[ ! "${line}" =~ ${pattern} ]] \
                || [[ "${BASH_REMATCH[1]}" != "${WORKFLOW_PATHS[index]}" ]]; then
                return 1
              fi
              index=$((index + 1))
            done <<< "$1"

            if (( index == ${#WORKFLOW_PATHS[@]} )); then
              return 0
            fi
            return 1
          }

          # Read the paginated listing at $4 and reduce it with the jq program
          # $6; any further arguments go to jq ahead of the program. $1 names
          # the listing and $2 what it is read for, in the log.
          #
          # On success sets QUERY_OBSERVATION to the program's output, once
          # the function named $5 has accepted it, and returns 0. Returns 1
          # when the listing could not be read within GATE_QUERY_MAX_ATTEMPTS
          # attempts or before $3, the wall-clock deadline shared with the
          # caller: an unreadable query is never success and never "not found
          # yet".
          #
          # The result travels in a variable rather than on stdout because this
          # function also logs there, and errexit is not in force for a function
          # called from a condition, so every failure is handled explicitly.
          query_api() {
            local kind="$1"
            local label="$2"
            local deadline="$3"
            local endpoint="$4"
            local accept="$5"
            local filter="$6"
            shift 6
            local attempt=1
            local backoff="${GATE_QUERY_BACKOFF_SECONDS}"
            local body observation reason stderr_path now rc

            QUERY_OBSERVATION=""

            while (( attempt <= GATE_QUERY_MAX_ATTEMPTS )); do
              stderr_path="$(mktemp)"
              rc=0
              body="$(
                timeout "${GATE_QUERY_TIMEOUT_SECONDS}" gh api \
                  -H "Accept: application/vnd.github+json" \
                  --paginate \
                  "${endpoint}" \
                  2>"${stderr_path}"
              )" || rc=$?

              if (( rc != 0 )); then
                reason="${kind} query failed (exit ${rc}): $(summarize_stderr "${stderr_path}")"
              else
                rc=0
                observation="$(
                  printf '%s' "${body}" \
                    | jq -e -r -s "$@" "${filter}" 2>"${stderr_path}"
                )" || rc=$?

                if (( rc != 0 )); then
                  reason="${kind} response could not be read (jq exit ${rc}): $(summarize_stderr "${stderr_path}")"
                elif "${accept}" "${observation}"; then
                  rm -f "${stderr_path}"
                  QUERY_OBSERVATION="${observation}"
                  return 0
                else
                  reason="${kind} response was malformed: $(printf '%s' "${observation}" | tr '\n' ' ' | cut -c1-300)"
                fi
              fi

              rm -f "${stderr_path}"
              echo "::warning title=Required Merge Gate retrying::${label}: ${reason} (attempt ${attempt}/${GATE_QUERY_MAX_ATTEMPTS})"

              attempt=$((attempt + 1))
              if (( attempt > GATE_QUERY_MAX_ATTEMPTS )); then
                break
              fi

              now="$(date +%s)"
              if (( now + backoff > deadline )); then
                echo "${label}: wait deadline reached while the ${kind} query was unreadable"
                break
              fi

              sleep "${backoff}"
              backoff=$((backoff * 2))
              if (( backoff > GATE_QUERY_BACKOFF_CAP_SECONDS )); then
                backoff="${GATE_QUERY_BACKOFF_CAP_SECONDS}"
              fi
            done

            return 1
          }

          # Read the newest check run named $1 in check suite $2, before the
          # deadline $3. QUERY_OBSERVATION becomes "absent" or
          # "found<TAB>status<TAB>conclusion".
          query_check_run() {
            query_api check-runs "$1" "$3" \
              "/repos/${REPOSITORY}/check-suites/$2/check-runs?per_page=100" \
              is_check_run_observation "${check_run_filter}" \
              --arg name "$1"
          }

          # Find, before the deadline $1, the run of each workflow that
          # belongs to this event, and record its check suite in
          # WORKFLOW_SUITE: "absent" while GitHub lists none.
          declare -A WORKFLOW_SUITE=()
          declare -A WORKFLOW_RUN=()
          resolve_workflow_runs() {
            local deadline="$1"
            local path suite run created

            if ! query_api workflow-runs "workflow runs" "${deadline}" \
              "/repos/${REPOSITORY}/actions/runs?head_sha=${SHA}&event=${EVENT_NAME}&per_page=100" \
              is_workflow_runs_observation "${workflow_run_filter}" \
              --arg event "${EVENT_NAME}" \
              --arg sha "${SHA}" \
              --argjson run_id "${RUN_ID}" \
              --argjson pr "${pr_json}" \
              --argjson skew "${SIBLING_RUN_SKEW_SECONDS}" \
              --arg workflows "${WORKFLOW_PATHS[*]}"
            then
              return 1
            fi

            while IFS=$'\t' read -r path suite run created; do
              if [[ "${suite}" != "absent" && "${run}" != "${WORKFLOW_RUN[${path}]:-}" ]]; then
                echo "${path}: reading run ${run} (check suite ${suite}, created ${created}) for this ${EVENT_NAME} event"
              fi
              WORKFLOW_SUITE["${path}"]="${suite}"
              WORKFLOW_RUN["${path}"]="${run}"
            done <<< "${QUERY_OBSERVATION}"
          }

          # Wait until every named check in this event's workflow runs has
          # concluded successfully.
          #
          # Returns 1 under three distinct error titles: a check concluded
          # something other than success, the workflow or check runs could
          # not be read, or the shared deadline passed with checks still
          # pending. Only a completed check with a success conclusion is
          # success, and a check from another event's runs is never read.
          wait_for_checks() {
            local check_names=("$@")
            local pending=()
            local check_name conclusion fields now observation status deadline suite workflow

            for check_name in "${check_names[@]}"; do
              if ! workflow_of "${check_name}" > /dev/null; then
                echo "::error title=Required Merge Gate failed::No workflow is known to report ${check_name}."
                return 1
              fi
            done

            now="$(date +%s)"
            deadline=$(( now + GATE_WAIT_TIMEOUT_SECONDS ))

            while :; do
              pending=()

              if ! resolve_workflow_runs "${deadline}"; then
                echo "::error title=Required Merge Gate could not read check runs::Workflow runs for this ${EVENT_NAME} event on ${SHA} could not be read after ${GATE_QUERY_MAX_ATTEMPTS} attempts; failing closed with no verdict for: ${check_names[*]}"
                return 1
              fi
              for check_name in "${check_names[@]}"; do
                workflow="$(workflow_of "${check_name}")"
                suite="${WORKFLOW_SUITE[${workflow}]}"
                if [[ "${suite}" == "absent" ]]; then
                  echo "${check_name}: query succeeded, no ${workflow} run for this ${EVENT_NAME} event on ${SHA} yet"
                  pending+=("${check_name}")
                  continue
                fi

                if ! query_check_run "${check_name}" "${suite}" "${deadline}"; then
                  echo "::error title=Required Merge Gate could not read check runs::Check runs for ${check_name} on ${SHA} could not be read after ${GATE_QUERY_MAX_ATTEMPTS} attempts; failing closed with no verdict for: ${check_names[*]}"
                  return 1
                fi
                observation="${QUERY_OBSERVATION}"

                if [[ "${observation}" == "absent" ]]; then
                  echo "${check_name}: query succeeded, no such check run in check suite ${suite} on ${SHA} yet"
                  pending+=("${check_name}")
                  continue
                fi

                fields="${observation#found$'\t'}"
                status="${fields%%$'\t'*}"
                conclusion="${fields#*$'\t'}"
                echo "${check_name}: status=${status} conclusion=${conclusion:-pending}"

                if [[ "${status}" == "completed" ]]; then
                  if [[ "${conclusion}" != "success" ]]; then
                    echo "::error title=Required Merge Gate failed::${check_name} concluded ${conclusion:-unknown}."
                    return 1
                  fi
                  continue
                fi

                pending+=("${check_name}")
              done

              if (( ${#pending[@]} == 0 )); then
                return 0
              fi

              now="$(date +%s)"
              if (( now + GATE_POLL_INTERVAL_SECONDS > deadline )); then
                echo "::error title=Required Merge Gate timed out::Required checks did not complete within ${GATE_WAIT_TIMEOUT_SECONDS}s and are still pending: ${pending[*]}"
                return 1
              fi

              sleep "${GATE_POLL_INTERVAL_SECONDS}"
            done
          }

          case "${VALIDATION_PROFILE}" in
            release-policy)
              echo "Validation profile ${VALIDATION_PROFILE} requires release-policy validation."
              if [[ "${RELEASE_POLICY_VALIDATION_RESULT}" != "success" ]]; then
                echo "::error title=Required Merge Gate failed::Release-policy validation result was ${RELEASE_POLICY_VALIDATION_RESULT}."
                exit 1
              fi
              wait_for_checks "Core Checks Gate"
              exit 0
              ;;
            rpc-docs)
              echo "Validation profile ${VALIDATION_PROFILE} requires RPC docs validation."
              if [[ "${RPC_DOCS_VALIDATION_RESULT}" != "success" ]]; then
                echo "::error title=Required Merge Gate failed::RPC docs validation result was ${RPC_DOCS_VALIDATION_RESULT}."
                exit 1
              fi
              wait_for_checks "rpc-docs"
              exit 0
              ;;
            public-docs)
              echo "Validation profile ${VALIDATION_PROFILE} requires public docs validation."
              if [[ "${PUBLIC_DOCS_VALIDATION_RESULT}" != "success" ]]; then
                echo "::error title=Required Merge Gate failed::Public docs validation result was ${PUBLIC_DOCS_VALIDATION_RESULT}."
                exit 1
              fi
              wait_for_checks "public-docs-lint"
              exit 0
              ;;
            github-metadata)
              echo "Validation profile ${VALIDATION_PROFILE} requires GitHub metadata validation."
              if [[ "${GITHUB_METADATA_VALIDATION_RESULT}" != "success" ]]; then
                echo "::error title=Required Merge Gate failed::GitHub metadata validation result was ${GITHUB_METADATA_VALIDATION_RESULT}."
                exit 1
              fi
              exit 0
              ;;
            source)
              if [[ "${SOURCE_VALIDATION_REQUIRED}" != "true" ]]; then
                echo "::error title=Required Merge Gate failed::Source validation flag was ${SOURCE_VALIDATION_REQUIRED}."
                exit 1
              fi
              echo "Validation profile ${VALIDATION_PROFILE} requires Core Checks Gate and Full Validation Gate."
              wait_for_checks "Core Checks Gate" "Full Validation Gate"
              ;;
            *)
              echo "::error title=Required Merge Gate failed::Unknown validation profile ${VALIDATION_PROFILE}."
              exit 1
              ;;
          esac
