name: Required Merge Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
    branches:
      - main
      - 0.1.x
      - 1.0.0
      - 1.x.x
      - develop
  push:
    branches:
      - main
      - 0.1.x
      - 1.0.0
      - 1.x.x
      - develop
  merge_group:
    branches:
      - main
      - 0.1.x
      - 1.0.0
      - 1.x.x
      - develop

permissions:
  contents: read

concurrency:
  group: required-merge-gate-${{ github.event_name != 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  classify-changes:
    name: classify validation profile
    runs-on: ubuntu-24.04
    outputs:
      profile: ${{ steps.classify.outputs.profile }}
      release_policy_only: ${{ steps.classify.outputs.release_policy_only }}
      rpc_docs_only: ${{ steps.classify.outputs.rpc_docs_only }}
      public_docs_only: ${{ steps.classify.outputs.public_docs_only }}
      github_metadata_only: ${{ steps.classify.outputs.github_metadata_only }}
      source_validation_required: ${{ steps.classify.outputs.source_validation_required }}
      touched_operator_keys: ${{ steps.classify.outputs.touched_operator_keys }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Write changed file list
        id: changed-files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail

          changed_files="${RUNNER_TEMP}/changed-files.txt"
          : > "${changed_files}"

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ -z "${BASE_SHA}" ]]; then
              echo "::error::Pull request base SHA is unavailable."
              exit 1
            fi
            git diff --no-renames --name-only "${BASE_SHA}...HEAD" > "${changed_files}"
          elif [[ "${EVENT_NAME}" == "merge_group" ]]; then
            base_branch="${BASE_REF#refs/heads/}"
            if [[ -z "${base_branch}" ]]; then
              echo "::error::Merge-group base branch is unavailable."
              exit 1
            fi
            git fetch --no-tags --prune origin "+refs/heads/${base_branch}:refs/remotes/origin/${base_branch}"
            git diff --no-renames --name-only "origin/${base_branch}...HEAD" > "${changed_files}"
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ -n "${BEFORE_SHA}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
              git diff --no-renames --name-only "${BEFORE_SHA}..HEAD" > "${changed_files}"
            else
              git fetch --no-tags --prune origin "${DEFAULT_BRANCH}"
              merge_base="$(git merge-base "origin/${DEFAULT_BRANCH}" HEAD 2>/dev/null || true)"
              if [[ -n "${merge_base}" ]]; then
                git diff --no-renames --name-only "${merge_base}...HEAD" > "${changed_files}"
              else
                git diff-tree --no-commit-id --name-only -r HEAD > "${changed_files}"
              fi
            fi
          else
            git diff-tree --no-commit-id --name-only -r HEAD > "${changed_files}"
          fi

          cat "${changed_files}"
          echo "changed_files=${changed_files}" >> "$GITHUB_OUTPUT"

      # The classifier decides which validation profile routes this change.
      # Its own unit tests run here, in the job that produces the routing
      # outputs, so a broken classifier fails this job (and therefore the
      # Required Merge Gate) instead of routing itself to a lightweight profile.
      - name: Test merge-profile classifier
        run: python3 ci/checks/test_classify_merge_profile.py -v

      - name: Install workflow contract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml

      # Use the system Python that owns the distribution's PyYAML package.
      # Wiring regressions must fail this job before it emits routing outputs.
      - name: Test classifier workflow contract
        run: /usr/bin/python3 ci/checks/test_classifier_ci_contract.py -v

      # A changed-file list that hides the source side of a rename routes a
      # source change to a lightweight profile.
      - name: Test changed-file listing contract
        run: /usr/bin/python3 ci/checks/test_changed_files_contract.py -v

      # The gate's waiting loop is what turns other checks into this required
      # check. Run its contract here, in a job the gate depends on, so a
      # regression that would let the gate pass on an unread or failed check
      # fails classification instead.
      - name: Test merge gate polling contract
        run: /usr/bin/python3 ci/checks/test_merge_gate_poller.py -v

      # The operator-key step must tie a changed policy to the base's: lift it
      # out of this workflow and run it against scratch key-policy histories.
      - name: Test operator key policy gate contract
        run: /usr/bin/python3 ci/checks/test_key_policy_gate_contract.py -v

      - name: Classify validation profile
        id: classify
        run: |
          python3 ci/checks/classify_merge_profile.py \
            --changed-files "${{ steps.changed-files.outputs.changed_files }}" \
            --github-output "$GITHUB_OUTPUT"

  operator-key-policy-validation:
    name: operator-key policy validation
    needs: classify-changes
    if: ${{ always() && needs.classify-changes.result == 'success' && needs.classify-changes.outputs.touched_operator_keys == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Install policy validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gpg

      - name: Validate current policy and transition approvals
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: |
          set -euo pipefail

          # contrib/keys/operator-keys is the only copy of the release key
          # policy in this repository. Mirrors and downstream pins are checked
          # against it by their own consumers (see contrib/keys/README.md).
          canonical_dir="contrib/keys/operator-keys"

          # The policy is checked against the base's: a changed keys.json must
          # follow the base policy directly, with approvals verified against the
          # base policy and certificates; certificates changed under an
          # unchanged keys.json get continuity checks. An empty base directory
          # means the base has no policy.
          base=""
          if [[ "${EVENT_NAME}" == "pull_request" || "${EVENT_NAME}" == "merge_group" ]]; then
            base="${BASE_SHA}"
          elif [[ "${EVENT_NAME}" == "push" && -n "${BEFORE_SHA}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
            base="${BEFORE_SHA}"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base="$(git rev-parse HEAD^)"
          fi
          if [[ -z "${base}" ]] || ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            echo "::error::Unable to identify the base commit for operator policy validation."
            exit 1
          fi

          # Both policies are read from git objects: no checkout, no
          # attributes. Every directory on the policy path must be a tree and
          # every file under it a regular 100644 blob.
          work="${RUNNER_TEMP}/key-policy"
          rm -rf "${work}"
          mkdir -p "${work}/head" "${work}/base"
          extract_policy() {
            local rev="$1" dest="$2" check_attributes="$3" prefix="" part entry meta path relative mode type oid
            for part in contrib keys operator-keys; do
              prefix="${prefix:+${prefix}/}${part}"
              entry="$(git ls-tree "${rev}" -- "${prefix}")"
              [[ -n "${entry}" ]] || return 0
              if [[ "${entry}" != "040000 tree "* ]]; then
                echo "::error::${rev}:${prefix} is not a directory: ${entry%%$'\t'*}"
                return 1
              fi
            done
            git ls-tree -r -z "${rev}" -- "${canonical_dir}" > "${dest}.list"
            while IFS= read -r -d '' entry; do
              meta="${entry%%$'\t'*}"
              path="${entry#*$'\t'}"
              read -r mode type oid <<< "${meta}"
              if [[ "${mode}" != "100644" || "${type}" != "blob" ]]; then
                echo "::error::${rev}:${path} is not a regular file (mode ${mode})"
                return 1
              fi
              relative="${path#"${canonical_dir}/"}"
              mkdir -p "$(dirname "${dest}/${relative}")"
              git cat-file blob "${oid}" > "${dest}/${relative}"
            done < "${dest}.list"
            # Checkout and archive attributes would make other readers of the
            # head see other bytes than these objects: none may apply to the
            # policy. The base's own attributes do not matter here.
            [[ "${check_attributes}" == "check-attributes" ]] || return 0
            git ls-tree -r -z --name-only "${rev}" -- "${canonical_dir}" \
              | git check-attr --source "${rev}" -z --stdin \
                  text eol crlf filter ident working-tree-encoding export-ignore export-subst \
              > "${dest}.attributes"
            while IFS= read -r -d '' path && IFS= read -r -d '' attribute && IFS= read -r -d '' value; do
              if [[ "${value}" != "unspecified" ]]; then
                echo "::error::${rev}:${path} has the ${attribute} attribute (${value})"
                return 1
              fi
            done < "${dest}.attributes"
          }
          extract_policy HEAD "${work}/head" check-attributes
          extract_policy "${base}" "${work}/base" no-attributes

          head_args=(
            --operator-policy "${work}/head/keys.json"
            --operator-keys-dir "${work}/head"
            --require-public-key-files
            --verify-public-key-certificates
            --base-operator-keys-dir "${work}/base"
          )
          # Once any first-parent ancestor of the base had a policy, the base must have one.
          if [[ -n "$(git rev-list --first-parent -n 1 "${base}" -- "${canonical_dir}/keys.json")" ]]; then
            head_args+=(--base-history-had-policy)
          fi
          python3 ci/release/validate_key_metadata.py "${head_args[@]}"

          # A change must also pass the base's own validator, read from git
          # objects, with the arguments every version of it accepts.
          if ! diff -r -q "${work}/head" "${work}/base" > /dev/null; then
            validator="ci/release/validate_key_metadata.py"
            if ! [[ "$(git ls-tree "${base}" -- "${validator}")" =~ ^100(644|755)\ blob\  ]]; then
              echo "::error::The base has no ${validator} to check this change with."
              exit 1
            fi
            git cat-file blob "${base}:${validator}" > "${work}/base-validator.py"
            base_args=(
              --operator-policy "${work}/head/keys.json"
              --operator-keys-dir "${work}/head"
              --require-public-key-files
            )
            if [[ -f "${work}/base/keys.json" ]]; then
              if cmp -s "${work}/head/keys.json" "${work}/base/keys.json"; then
                base_args+=(--skip-policy-transition-validation)
              else
                base_args+=(--previous-operator-policy "${work}/base/keys.json")
              fi
            fi
            echo "Checking the change with the base's validator"
            python3 "${work}/base-validator.py" "${base_args[@]}"
          fi

  release-policy-validation:
    name: release-policy validation
    needs: classify-changes
    if: ${{ always() && needs.classify-changes.result == 'success' && needs.classify-changes.outputs.release_policy_only == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Write changed file list
        id: changed-files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail

          changed_files="${RUNNER_TEMP}/changed-files.txt"
          diff_range=""
          : > "${changed_files}"

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ -z "${BASE_SHA}" ]]; then
              echo "::error::Pull request base SHA is unavailable."
              exit 1
            fi
            diff_range="${BASE_SHA}...HEAD"
            git diff --no-renames --name-only "${diff_range}" > "${changed_files}"
          elif [[ "${EVENT_NAME}" == "merge_group" ]]; then
            base_branch="${BASE_REF#refs/heads/}"
            if [[ -z "${base_branch}" ]]; then
              echo "::error::Merge-group base branch is unavailable."
              exit 1
            fi
            git fetch --no-tags --prune origin "+refs/heads/${base_branch}:refs/remotes/origin/${base_branch}"
            diff_range="origin/${base_branch}...HEAD"
            git diff --no-renames --name-only "${diff_range}" > "${changed_files}"
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ -n "${BEFORE_SHA}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
              diff_range="${BEFORE_SHA}..HEAD"
              git diff --no-renames --name-only "${diff_range}" > "${changed_files}"
            else
              git fetch --no-tags --prune origin "${DEFAULT_BRANCH}"
              merge_base="$(git merge-base "origin/${DEFAULT_BRANCH}" HEAD 2>/dev/null || true)"
              if [[ -n "${merge_base}" ]]; then
                diff_range="${merge_base}...HEAD"
                git diff --no-renames --name-only "${diff_range}" > "${changed_files}"
              else
                git diff-tree --no-commit-id --name-only -r HEAD > "${changed_files}"
              fi
            fi
          else
            git diff-tree --no-commit-id --name-only -r HEAD > "${changed_files}"
          fi

          cat "${changed_files}"
          echo "changed_files=${changed_files}" >> "$GITHUB_OUTPUT"
          echo "diff_range=${diff_range}" >> "$GITHUB_OUTPUT"

      - name: Confirm release-policy-only profile
        id: classify
        run: |
          python3 ci/checks/classify_merge_profile.py \
            --changed-files "${{ steps.changed-files.outputs.changed_files }}" \
            --github-output "$GITHUB_OUTPUT" \
            --require-release-policy-only

      - name: Check whitespace in changed files
        env:
          DIFF_RANGE: ${{ steps.changed-files.outputs.diff_range }}
        run: |
          set -euo pipefail

          if [[ -n "${DIFF_RANGE}" ]]; then
            git diff --check "${DIFF_RANGE}"
          else
            git diff-tree --check --root HEAD
          fi

      - name: Check release publisher syntax
        if: steps.classify.outputs.touched_release_publish == 'true'
        run: |
          set -euo pipefail
          bash -n contrib/release-process/publish-local-release.sh

      - name: Run release validator tests
        if: steps.classify.outputs.touched_release_publish == 'true' || steps.classify.outputs.touched_release_validators == 'true'
        run: |
          set -euo pipefail

          tests=(
            ci.release.test_publish_local_release
            ci.release.test_validate_builder_attestations
            ci.release.test_validate_key_metadata
            ci.release.test_validate_release_artifacts
            ci.release.test_verify_mainnet_ci_posture
            ci.release.test_verify_mainnet_release_posture
            ci.release.test_verify_p2mr_v1_conformance
          )
          if [[ -f ci/release/test_verify_testnet_release_posture.py ]]; then
            tests+=(ci.release.test_verify_testnet_release_posture)
          fi
          python3 -m unittest "${tests[@]}"

      - name: Validate operator key metadata
        if: steps.classify.outputs.touched_operator_keys == 'true'
        run: |
          python3 ci/release/validate_key_metadata.py \
            --operator-policy contrib/keys/operator-keys/keys.json \
            --operator-keys-dir contrib/keys/operator-keys \
            --require-public-key-files \
            --skip-policy-transition-validation

  rpc-docs-validation:
    name: rpc-docs validation
    needs: classify-changes
    if: ${{ always() && needs.classify-changes.result == 'success' && needs.classify-changes.outputs.profile == 'rpc-docs' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Write changed file list
        id: changed-files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail

          changed_files="${RUNNER_TEMP}/changed-files.txt"
          diff_range=""
          : > "${changed_files}"

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ -z "${BASE_SHA}" ]]; then
              echo "::error::Pull request base SHA is unavailable."
              exit 1
            fi
            diff_range="${BASE_SHA}...HEAD"
            git diff --no-renames --name-only "${diff_range}" > "${changed_files}"
          elif [[ "${EVENT_NAME}" == "merge_group" ]]; then
            base_branch="${BASE_REF#refs/heads/}"
            if [[ -z "${base_branch}" ]]; then
              echo "::error::Merge-group base branch is unavailable."
              exit 1
            fi
            git fetch --no-tags --prune origin "+refs/heads/${base_branch}:refs/remotes/origin/${base_branch}"
            diff_range="origin/${base_branch}...HEAD"
            git diff --no-renames --name-only "${diff_range}" > "${changed_files}"
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ -n "${BEFORE_SHA}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
              diff_range="${BEFORE_SHA}..HEAD"
              git diff --no-renames --name-only "${diff_range}" > "${changed_files}"
            else
              git fetch --no-tags --prune origin "${DEFAULT_BRANCH}"
              merge_base="$(git merge-base "origin/${DEFAULT_BRANCH}" HEAD 2>/dev/null || true)"
              if [[ -n "${merge_base}" ]]; then
                diff_range="${merge_base}...HEAD"
                git diff --no-renames --name-only "${diff_range}" > "${changed_files}"
              else
                git diff-tree --no-commit-id --name-only -r HEAD > "${changed_files}"
              fi
            fi
          else
            git diff-tree --no-commit-id --name-only -r HEAD > "${changed_files}"
          fi

          cat "${changed_files}"
          echo "changed_files=${changed_files}" >> "$GITHUB_OUTPUT"
          echo "diff_range=${diff_range}" >> "$GITHUB_OUTPUT"

      - name: Confirm rpc-docs profile
        run: |
          python3 ci/checks/classify_merge_profile.py \
            --changed-files "${{ steps.changed-files.outputs.changed_files }}" \
            --require-profile rpc-docs

      - name: Check whitespace in changed files
        env:
          DIFF_RANGE: ${{ steps.changed-files.outputs.diff_range }}
        run: |
          set -euo pipefail

          if [[ -n "${DIFF_RANGE}" ]]; then
            git diff --check "${DIFF_RANGE}"
          else
            git diff-tree --check --root HEAD
          fi

      - name: Run RPC docs unit tests
        run: python3 -m unittest discover -s test/rpc_docs

  public-docs-validation:
    name: public-docs validation
    needs: classify-changes
    if: ${{ always() && needs.classify-changes.result == 'success' && needs.classify-changes.outputs.profile == 'public-docs' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Write changed file list
        id: changed-files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail

          changed_files="${RUNNER_TEMP}/changed-files.txt"
          diff_range=""
          : > "${changed_files}"

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ -z "${BASE_SHA}" ]]; then
              echo "::error::Pull request base SHA is unavailable."
              exit 1
            fi
            diff_range="${BASE_SHA}...HEAD"
            git diff --no-renames --name-only "${diff_range}" > "${changed_files}"
          elif [[ "${EVENT_NAME}" == "merge_group" ]]; then
            base_branch="${BASE_REF#refs/heads/}"
            if [[ -z "${base_branch}" ]]; then
              echo "::error::Merge-group base branch is unavailable."
              exit 1
            fi
            git fetch --no-tags --prune origin "+refs/heads/${base_branch}:refs/remotes/origin/${base_branch}"
            diff_range="origin/${base_branch}...HEAD"
            git diff --no-renames --name-only "${diff_range}" > "${changed_files}"
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ -n "${BEFORE_SHA}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
              diff_range="${BEFORE_SHA}..HEAD"
              git diff --no-renames --name-only "${diff_range}" > "${changed_files}"
            else
              git fetch --no-tags --prune origin "${DEFAULT_BRANCH}"
              merge_base="$(git merge-base "origin/${DEFAULT_BRANCH}" HEAD 2>/dev/null || true)"
              if [[ -n "${merge_base}" ]]; then
