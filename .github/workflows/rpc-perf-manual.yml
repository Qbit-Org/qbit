name: RPC Performance Benchmark
run-name: >-
  RPC perf (${{ github.event_name == 'schedule' && 'nightly' || 'manual' }},
  scale=${{ github.event_name == 'schedule' && '1.0' || inputs.run_scale }},
  ref=${{ github.event_name == 'schedule' && 'v30.2' || inputs.reference_ref }},
  branch=${{ github.event_name == 'schedule' && '1.x.x' || github.ref_name }})

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      run_scale:
        description: Scale manifest run counts for smoke runs or deeper sampling
        required: true
        default: "1.0"
        type: string
      benchmark_filter:
        description: Optional regex to select benchmark ids
        required: false
        default: ""
        type: string
      include_reference:
        description: Build Bitcoin Core v30.2 and run the shared-endpoint comparison lane
        required: true
        default: true
        type: boolean
      reference_ref:
        description: Bitcoin Core tag or branch to benchmark against
        required: true
        default: "v30.2"
        type: string

concurrency:
  group: rpc-perf-${{ github.event_name == 'schedule' && 'nightly-1.x.x' || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-source:
    name: Resolve source
    runs-on: ${{ github.repository == 'Qbit-Org/qbit' && fromJSON('["self-hosted", "linux", "x64", "qbit-trusted-ci"]') || fromJSON('["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 10
    outputs:
      source_mode: ${{ steps.resolve.outputs.source_mode }}
      requested_ref: ${{ steps.resolve.outputs.requested_ref }}
      requested_ref_name: ${{ steps.resolve.outputs.requested_ref_name }}
      resolved_sha: ${{ steps.resolve.outputs.resolved_sha }}
    steps:
      - name: Resolve source
        id: resolve
        shell: bash
        env:
          SOURCE_MODE: ${{ github.event_name == 'schedule' && 'maintained' || 'manual' }}
          MAINTAINED_BRANCH: 1.x.x
          REQUESTED_REF: ${{ github.event_name != 'schedule' && github.ref || '' }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Resolve the validation source once per run, before any checkout, so
          # every job below builds and reports the same immutable commit. The
          # scheduled source is the maintained branch; a manual run keeps the
          # selected ref and its event commit.
          fail() { echo "::error::$*" >&2; exit 1; }
          is_full_sha() { printf '%s\n' "$1" | LC_ALL=C grep -Eq '^[0-9a-f]{40}$'; }

          case "$SOURCE_MODE" in
            maintained)
              [ -n "$MAINTAINED_BRANCH" ] || fail "MAINTAINED_BRANCH is empty"
              requested_ref="refs/heads/${MAINTAINED_BRANCH}"
              git check-ref-format "$requested_ref" || fail "invalid maintained branch ref '$requested_ref'"
              auth=()
              if [ -n "${GITHUB_TOKEN:-}" ]; then
                auth=(-c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')")
              fi
              listing="$(git ${auth[@]+"${auth[@]}"} ls-remote --exit-code -- "$SOURCE_REPOSITORY_URL" "$requested_ref")" \
                || fail "could not list '$requested_ref' from '$SOURCE_REPOSITORY_URL'"
              resolved_sha="$(printf '%s\n' "$listing" | awk -v ref="$requested_ref" '$2 == ref { print $1 }')"
              [ "$(printf '%s\n' "$resolved_sha" | grep -c .)" -eq 1 ] \
                || fail "expected exactly one '$requested_ref' in remote listing: $listing"
              ;;
            manual)
              requested_ref="$REQUESTED_REF"
              resolved_sha="$EVENT_SHA"
              ;;
            *)
              fail "unsupported SOURCE_MODE '$SOURCE_MODE'"
              ;;
          esac

          case "$requested_ref" in
            refs/heads/?*|refs/tags/?*) ;;
            *) fail "requested ref '$requested_ref' must be a fully qualified branch or tag ref" ;;
          esac
          git check-ref-format "$requested_ref" || fail "requested ref '$requested_ref' is not a valid git ref name"
          is_full_sha "$resolved_sha" || fail "resolved source '$resolved_sha' is not a full commit hash"
          is_full_sha "$WORKFLOW_SHA" || fail "workflow revision '$WORKFLOW_SHA' is not a full commit hash"
          requested_ref_name="${requested_ref#refs/heads/}"
          requested_ref_name="${requested_ref_name#refs/tags/}"

          {
            echo "source_mode=$SOURCE_MODE"
            echo "requested_ref=$requested_ref"
            echo "requested_ref_name=$requested_ref_name"
            echo "resolved_sha=$resolved_sha"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Validation source"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| source_mode | $SOURCE_MODE |"
            echo "| requested_ref | $requested_ref |"
            echo "| resolved_sha | $resolved_sha |"
            echo "| event_sha | $EVENT_SHA |"
            echo "| workflow_sha | $WORKFLOW_SHA |"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

  rpc-perf:
    name: RPC perf
    needs: resolve-source
    runs-on: ${{ github.repository == 'Qbit-Org/qbit' && fromJSON('["self-hosted", "linux", "x64", "qbit-trusted-ci"]') || fromJSON('["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 720
    env:
      RUN_MODE: ${{ github.event_name == 'schedule' && 'nightly' || 'manual' }}
      SOURCE_MODE: ${{ needs.resolve-source.outputs.source_mode }}
      REQUESTED_REF: ${{ needs.resolve-source.outputs.requested_ref }}
      RESOLVED_SHA: ${{ needs.resolve-source.outputs.resolved_sha }}
      BENCHMARK_REF_NAME: ${{ needs.resolve-source.outputs.requested_ref_name }}
      PERF_BUILD_DIR: ${{ github.workspace }}/build-rpc-perf
      PERF_ARTIFACT_ROOT: ${{ github.workspace }}/build-rpc-perf-artifacts/rpc-perf-${{ github.run_id }}
      REFERENCE_REPO: https://github.com/bitcoin/bitcoin.git
      REFERENCE_ROOT: ${{ github.workspace }}/build-rpc-perf-reference/bitcoin-core-reference
      REFERENCE_BUILD_DIR: ${{ github.workspace }}/build-rpc-perf-reference/bitcoin-core-reference/build
      RUN_SCALE: ${{ github.event_name == 'schedule' && '1.0' || inputs.run_scale }}
      BENCHMARK_FILTER: ${{ github.event_name != 'schedule' && inputs.benchmark_filter || '' }}
      INCLUDE_REFERENCE: ${{ github.event_name == 'schedule' && 'true' || inputs.include_reference }}
      REFERENCE_REF: ${{ github.event_name == 'schedule' && 'v30.2' || inputs.reference_ref }}
    steps:
      - name: Require resolved source
        shell: bash
        env:
          RESOLVED_SHA: ${{ needs.resolve-source.outputs.resolved_sha }}
          REQUESTED_REF: ${{ needs.resolve-source.outputs.requested_ref }}
        run: |
          set -euo pipefail
          # Refuse to check out anything but the per-run resolved commit; an
          # empty ref would silently fall back to the triggering commit.
          printf '%s\n' "$RESOLVED_SHA" | LC_ALL=C grep -Eq '^[0-9a-f]{40}$' \
            || { echo "::error::resolved source '$RESOLVED_SHA' is not a full commit hash" >&2; exit 1; }
          [ -n "$REQUESTED_REF" ] || { echo "::error::requested ref is empty" >&2; exit 1; }

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.resolve-source.outputs.resolved_sha }}
          fetch-depth: 1

      - name: Verify checked-out source
        shell: bash
        env:
          SOURCE_MODE: ${{ needs.resolve-source.outputs.source_mode }}
          REQUESTED_REF: ${{ needs.resolve-source.outputs.requested_ref }}
          RESOLVED_SHA: ${{ needs.resolve-source.outputs.resolved_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse --verify 'HEAD^{commit}')"
          if [ "$actual_head" != "$RESOLVED_SHA" ]; then
            echo "::error::checked-out HEAD $actual_head does not match resolved source $RESOLVED_SHA" >&2
            exit 1
          fi
          {
            echo "### Checked-out source: ${GITHUB_JOB}${MATRIX_NAME:+ ($MATRIX_NAME)}"
            echo
            echo "- source_mode: ${SOURCE_MODE}"
            echo "- requested_ref: ${REQUESTED_REF}"
            echo "- resolved_sha: ${RESOLVED_SHA}"
            echo "- actual_head: ${actual_head}"
            echo "- workflow_sha: ${WORKFLOW_SHA}"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: ci/install-perf-dependencies.sh

      - name: Capture host metadata
        run: |
          mkdir -p \
            "$PERF_ARTIFACT_ROOT"/qbit-only \
            "$PERF_ARTIFACT_ROOT"/compare \
            "$PERF_ARTIFACT_ROOT"/summary
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "git_commit=$(git rev-parse HEAD)"
            echo "github_repository=${GITHUB_REPOSITORY}"
            echo "github_workflow=${GITHUB_WORKFLOW}"
            echo "github_run_id=${GITHUB_RUN_ID}"
            echo "github_run_number=${GITHUB_RUN_NUMBER}"
            echo "github_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "workflow_event=${GITHUB_EVENT_NAME}"
            echo "benchmark_mode=${RUN_MODE}"
            echo "github_ref=${GITHUB_REF}"
            echo "github_ref_name=${GITHUB_REF_NAME}"
            echo "github_sha=${GITHUB_SHA}"
            echo "workflow_sha=${GITHUB_WORKFLOW_SHA}"
            echo "source_mode=${SOURCE_MODE}"
            echo "requested_ref=${REQUESTED_REF}"
            echo "resolved_sha=${RESOLVED_SHA}"
            echo "checkout_ref=${RESOLVED_SHA}"
            echo "benchmark_ref_name=${BENCHMARK_REF_NAME}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "kernel=$(uname -srmo)"
            echo "manifest_sha256=$(sha256sum test/functional/data/rpc_perf_manifest.json | awk '{print $1}')"
            echo "run_scale=${RUN_SCALE}"
            echo "benchmark_filter=${BENCHMARK_FILTER}"
            echo "include_reference=${INCLUDE_REFERENCE}"
            echo "reference_ref=${REFERENCE_REF}"
          } > "$PERF_ARTIFACT_ROOT/summary/host.env"
          {
            uname -a
            echo
            cat /etc/os-release || true
            echo
            lscpu || true
            echo
            free -h || true
            echo
            df -h || true
          } > "$PERF_ARTIFACT_ROOT/summary/host.txt"

      - name: Configure qbit build
        run: |
          CC=clang-16 CXX='clang++-16 -stdlib=libc++' \
          cmake -B "$PERF_BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_IPC=OFF

      - name: Build qbit RPC targets
        run: |
          cmake --build "$PERF_BUILD_DIR" -j"$(nproc)" \
            --target qbitd qbit-cli
          "$PERF_BUILD_DIR/bin/qbitd" -version > "$PERF_ARTIFACT_ROOT/summary/qbit-version.txt"

      - name: Checkout Bitcoin Core reference
        if: ${{ env.INCLUDE_REFERENCE == 'true' }}
        run: |
          if [ -e "$REFERENCE_ROOT" ]; then
            mv "$REFERENCE_ROOT" "${REFERENCE_ROOT}.stale-$(date +%Y%m%d-%H%M%S)"
          fi
          git clone --branch "$REFERENCE_REF" --depth 1 --single-branch \
            "$REFERENCE_REPO" "$REFERENCE_ROOT"

      - name: Configure Bitcoin Core reference build
        if: ${{ env.INCLUDE_REFERENCE == 'true' }}
        run: |
          CC=clang-16 CXX='clang++-16 -stdlib=libc++' \
          cmake -S "$REFERENCE_ROOT" -B "$REFERENCE_BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_IPC=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_GUI=OFF \
            -DBUILD_BENCH=OFF \
            -DBUILD_FUZZ_BINARY=OFF

      - name: Build Bitcoin Core reference targets
        if: ${{ env.INCLUDE_REFERENCE == 'true' }}
        run: |
          cmake --build "$REFERENCE_BUILD_DIR" -j"$(nproc)" \
            --target bitcoind bitcoin-cli
          "$REFERENCE_BUILD_DIR/bin/bitcoind" -version > "$PERF_ARTIFACT_ROOT/summary/reference-version.txt"

      - name: Run qbit-only RPC benchmark
        run: |
          set -euo pipefail
          ulimit -n 10240
          filter_args=()
          if [ -n "$BENCHMARK_FILTER" ]; then
            filter_args+=(--benchmark-filter="$BENCHMARK_FILTER")
          fi
          python3 test/functional/feature_rpc_perf.py \
            --configfile="$PERF_BUILD_DIR/test/config.ini" \
            --run-scale="$RUN_SCALE" \
            --no-reference \
            "${filter_args[@]}" \
            --report-file="$PERF_ARTIFACT_ROOT/qbit-only/feature-rpc-perf-report.json" \
            --summary-file="$PERF_ARTIFACT_ROOT/qbit-only/feature-rpc-perf-summary.md" \
            --inventory-file="$PERF_ARTIFACT_ROOT/qbit-only/feature-rpc-perf-inventory.json" \
            --coverage-file="$PERF_ARTIFACT_ROOT/qbit-only/feature-rpc-perf-coverage.json"

      - name: Run qbit vs Bitcoin Core RPC benchmark
        if: ${{ env.INCLUDE_REFERENCE == 'true' }}
        run: |
          set -euo pipefail
          ulimit -n 10240
          filter_args=()
          if [ -n "$BENCHMARK_FILTER" ]; then
            filter_args+=(--benchmark-filter="$BENCHMARK_FILTER")
          fi
          python3 test/functional/feature_rpc_perf.py \
            --configfile="$PERF_BUILD_DIR/test/config.ini" \
            --run-scale="$RUN_SCALE" \
            --reference-bin-dir="$REFERENCE_BUILD_DIR/bin" \
            --reference-srcdir="$REFERENCE_ROOT" \
            --reference-label="bitcoin-core-${REFERENCE_REF}" \
            "${filter_args[@]}" \
            --report-file="$PERF_ARTIFACT_ROOT/compare/feature-rpc-perf-report.json" \
            --summary-file="$PERF_ARTIFACT_ROOT/compare/feature-rpc-perf-summary.md" \
            --inventory-file="$PERF_ARTIFACT_ROOT/compare/feature-rpc-perf-inventory.json" \
            --coverage-file="$PERF_ARTIFACT_ROOT/compare/feature-rpc-perf-coverage.json"

      - name: Append benchmark summaries
        if: always()
        run: |
          {
            echo "# RPC Performance Benchmark"
            echo ""
            echo "## Qbit Only"
            if [ -f "$PERF_ARTIFACT_ROOT/qbit-only/feature-rpc-perf-summary.md" ]; then
              tail -n +2 "$PERF_ARTIFACT_ROOT/qbit-only/feature-rpc-perf-summary.md"
            else
              echo "qbit-only summary missing"
            fi
            if [ "$INCLUDE_REFERENCE" = "true" ] && [ -f "$PERF_ARTIFACT_ROOT/compare/feature-rpc-perf-summary.md" ]; then
              echo ""
              echo "## Qbit vs Bitcoin Core ${REFERENCE_REF}"
              tail -n +2 "$PERF_ARTIFACT_ROOT/compare/feature-rpc-perf-summary.md"
            elif [ "$INCLUDE_REFERENCE" = "true" ]; then
              echo ""
              echo "## Qbit vs Bitcoin Core ${REFERENCE_REF}"
              echo "comparison summary missing"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload RPC perf artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpc-perf-${{ github.run_id }}
          path: ${{ env.PERF_ARTIFACT_ROOT }}
          retention-days: 30
