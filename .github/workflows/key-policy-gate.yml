name: Key Policy Gate

# Checks a pull request's changes to the release key policy, and to the code
# that checks it, with the base branch's code only. pull_request_target runs
# this workflow as the base branch defines it; the job checks out only the
# base commit and reads the pull request's commits as git objects, so nothing
# from the pull request runs here. See contrib/keys/README.md.
on:
  pull_request_target:
    # edited: a new base branch means the gate runs again against it.
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: key-policy-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  key-policy-gate:
    # A required status check: keep this name stable.
    name: Key Policy Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the base branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install gpg
        run: |
          sudo apt-get update
          sudo apt-get install -y gpg

      - name: Fetch the pull request's commits as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --no-recurse-submodules origin \
            "+refs/pull/${PR_NUMBER}/head:refs/key-policy-gate/head"
          fetched="$(git rev-parse refs/key-policy-gate/head)"
          if [[ "${fetched}" != "${HEAD_SHA}" ]]; then
            echo "::error::Fetched ${fetched} for pull request ${PR_NUMBER}, expected ${HEAD_SHA}."
            exit 1
          fi

      - name: Check gated changes with the base's code
        env:
          BASE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -I ci/release/key_policy_gate.py target \
            --base "${BASE_SHA}" --head "${HEAD_SHA}" --work "${RUNNER_TEMP}/key-policy-gate"
