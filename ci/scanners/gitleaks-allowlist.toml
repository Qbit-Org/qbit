title = "qbit gitleaks allowlist"

[extend]
useDefault = true

[[allowlists]]
description = "Deterministic P2MR data-hash proof vector key material"
condition = "AND"
regexTarget = "line"
paths = [
  '''src/test/data/p2mr_datapqchash_vectors\.json''',
]
regexes = [
  '''"(keygen_entropy|secret_key)": "[0-9a-f]+"''',
]

[[allowlists]]
description = "Fuzz seed format tags (qbfx-v1-fixture, qbfx-v1-generation) that generic-api-key reads as values"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''test/fuzz/qbit_corpora/generate_seeds\.py''',
]
regexes = [
  '''^qbfx-v1-(fixture|generation)$''',
]
